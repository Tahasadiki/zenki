[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zenki"
version = "0.1.0"
description = "Adaptive AI assistant agent with human-inspired memory and self-improvement"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Zenki Contributors" },
]
keywords = ["ai", "agent", "assistant", "claude", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "apscheduler>=3.10,<4.0",
    "claude-agent-sdk>=0.1.40",
]

[project.optional-dependencies]
claude = [
    "anthropic>=0.40.0",
]
slack = [
    "slack-bolt>=1.18",
]
embeddings = [
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.0",
]
all = [
    "zenki[claude,slack,embeddings]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
zenki = "zenki.cli.app:app"

[project.urls]
Homepage = "https://github.com/zenki-ai/zenki"
Repository = "https://github.com/zenki-ai/zenki"

[tool.hatch.build.targets.wheel]
packages = ["src/zenki"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
